name: Refresh Dependabot Requirements

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, master]
    paths:
      - requirements.in
      - requirements.txt

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  refresh-requirements:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Install uv
        run: python -m pip install uv

      - name: Regenerate requirements lock
        run: |
          uv pip compile requirements.in --universal --python-version 3.11 -o requirements.txt --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.11 -o requirements.txt"

      - name: Check for lockfile changes
        id: lockfile
        run: |
          if git diff --quiet requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit regenerated lockfile
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "Regenerate requirements lock"
          git push

      - name: Re-run PR tests for updated lockfile
        if: steps.lockfile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run test.yml --ref "$PR_HEAD_REF"
