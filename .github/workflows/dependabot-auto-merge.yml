name: Merge Dependabot PRs

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [Test PR]
    types: [completed]
  # Retry when other checks finish later, and update PRs after another PR merges.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'SECQUOIA/pyomo_jupyter_book' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out or execute PR code with this workflow's write token.
      - name: Checkout trusted automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge Dependabot updates with passing CI
        run: python .github/scripts/merge_dependabot.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
